<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  // Configurar el worker de PDF.js (Obligatorio)
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
<script>
  "use strict";

  // Setting Color

  var TableRender;
  var DataAnalistaCache = null;


  $(document).ready(function () {
    // Solución para Bootstrap 5: Permite escribir en campos fuera del modal (Panel de Correo y SweetAlerts)
    document.addEventListener('focusin', (e) => {
      if (e.target.closest('.renovacion-correo-overlay') || e.target.closest('.swal2-container')) {
        e.stopImmediatePropagation();
      }
    }, true);


    window.currentLeadData = null;

    window.DataRenovacionesGlobal = {
      pendientes: [],
      especiales: [],
      renovadas: []
    };

    window.TableRenovacionesRender = null;
    window.RolGlobal = null;
    /** Última respuesta de GetDataUser (una sola carga inicial; el sidebar no vuelve a llamar al API). */
    window.LastGetDataUserResponse = null;
    /** Índice 4 de GetDataUser: Tabla Asignación Usuarios + cupos colas (vista previa correo sin API). */
    window.RenovacionCorreoMetaInicial = { usuariosAsignacion: [], agentesRenovations: [], agentesCorreccionesBI: [] };

    console.log("Sistema de Renovaciones inicializado");

    function showModuloGestionDocumental() {
      $("#ModuleGestionDocumental").show();
      $("#ModuleRenovaciones").prop("hidden", true);
    }

    function showModuloRenovaciones() {
      $("#ModuleGestionDocumental").hide();
      $("#ModuleRenovaciones").prop("hidden", false);
    }

    function destroyPendingTableIfAny() {
      if (typeof TableRender !== "undefined" && TableRender && $.fn.DataTable.isDataTable("#Table_Clients_Pending")) {
        TableRender.clear().destroy();
        TableRender = null;
      }
    }

    function navActivoGestionDocumental() {
      $("#ListModuleGestionDocumental").addClass("active");
      $("#ListModuleRenovacionesNav").removeClass("active");
    }

    function navActivoRenovaciones() {
      $("#ListModuleRenovacionesNav").addClass("active");
      $("#ListModuleGestionDocumental").removeClass("active");
    }

    function aplicarVistaGestionDocumentalDesdeCache() {
      if (!LastGetDataUserResponse || LastGetDataUserResponse[0] !== "Autenticado") {
        return;
      }
      var rol = LastGetDataUserResponse[3];
      var payload = LastGetDataUserResponse[1];
      if (rol === "Gestión Documental" || (Array.isArray(rol) && rol.includes("Gestión Documental"))) {
        var allData = payload.gestionDocumental || payload;
        var leadsInternos = [];
        var leadsBrokers = [];
        if (Array.isArray(allData)) {
          allData.forEach(function(row) {
            var tipo = row[row.length - 1];
            if (tipo === "broker-inmobiliaria") {
              leadsBrokers.push(row);
            } else {
              leadsInternos.push(row);
            }
          });
        }
        CreatePendingTable(ReorganizeData(leadsInternos), leadsBrokers);
      } else if (rol === "Gestión Documental 2") {
        CreatePendingTable([], payload);
      } else {
        CreatePendingTable([], []);
      }
    }

    $("#ButtonMenuGestionDocumental").click(function (e) {
      e.preventDefault();

      // 1. Mostrar visualmente el módulo (esto no borra datos)
      showModuloGestionDocumental();
      navActivoGestionDocumental();

      // 2. LÓGICA CLAVE:
      // Solo intentamos crear la tabla si NO ha sido inicializada previamente.
      // Si ya existe, NO hacemos nada más, así la información se mantiene tal cual estaba.
      if (!$.fn.DataTable.isDataTable("#Table_Clients_Pending")) {
        console.log("Inicializando tabla por primera vez...");
        aplicarVistaGestionDocumentalDesdeCache();
      } else {
        console.log("La tabla ya existe, manteniendo datos actuales.");
      }
    });

    $("#ButtonMenuRenovaciones").click(function (e) {
      e.preventDefault();
      showModuloRenovaciones();
      navActivoRenovaciones();
      if (!DataRenovacionesGlobal) {
        DataRenovacionesGlobal = { pendientes: [], especiales: [], renovadas: [] };
      }
      UpdateRenovacionesUI();
    });

    $(document).on('click', '.card-expedicion', function () {
      console.log("Click en card Expedición");
      FilterRenovaciones('pendientes');
    });

    $(document).on('click', '.card-especial', function () {
      console.log("Click en card Especiales");
      FilterRenovaciones('especiales');
    });

    $(document).on('click', '.card-renovada', function () {
      console.log("Click en card Renovadas");
      FilterRenovaciones('renovadas');
    });


    function validarEstructuraDatos(data) {
      if (!data) {
        console.error("Data es null o undefined");
        return false;
      }

      const camposRequeridos = ['pendientes', 'especiales', 'renovadas'];
      for (let campo of camposRequeridos) {
        if (!Array.isArray(data[campo])) {
          console.error(`Campo ${campo} no es un array válido`);
          return false;
        }
      }

      console.log("Estructura de datos válida");
      console.log(`Pendientes: ${data.pendientes.length}`);
      console.log(`Especiales: ${data.especiales.length}`);
      console.log(`Renovadas: ${data.renovadas.length}`);

      return true;
    }


    function handleError(e) {
      console.error("Error:", e);
      $("#overlay").hide();

      if (String(e).includes("NetworkError")) {
        Swal.fire({
          title: 'Error de Conexión',
          icon: 'error',
          html: 'Verifica la conexión a internet.',
          showCancelButton: false,
          confirmButtonText: "Cerrar"
        });
      } else {
        Swal.fire({
          title: 'Error de Ejecución',
          icon: 'error',
          html: 'Presentamos fallas en este momento, estamos trabajando para solucionarlo lo más pronto posible.',
          showCancelButton: false,
          confirmButtonText: "Cerrar"
        });
      }
    }

    window.UpdateRenovacionesUI = function () {
      console.log("Actualizando UI de Renovaciones");
      console.log("Datos globales:", DataRenovacionesGlobal);

      if (!validarEstructuraDatos(DataRenovacionesGlobal)) {
        Swal.fire('Error', 'Estructura de datos inválida', 'error');
        return;
      }

      // Actualizar Cards
      const totalPendientes = DataRenovacionesGlobal.pendientes.length;
      const totalEspeciales = DataRenovacionesGlobal.especiales.length;
      const totalRenovadas = DataRenovacionesGlobal.renovadas.length;

      $("#TotalExpedicion").text(totalPendientes);
      $("#TotalEspeciales").text(totalEspeciales);
      $("#TotalRenovadas").text(totalRenovadas);

      // Renderizar tabla con datos pendientes por defecto
      RenderRenovacionesTable(DataRenovacionesGlobal.pendientes);

      console.log("UI actualizada correctamente");
    };

    /* --- Modal correo renovaciones (US-01 a US-03) --- */
    window._pendingRenovacionDecisionPayload = null;
    window._currentRenovacionCorreoAction = null;

    function buildRenovacionCorreoContext() {
      if (!currentFullData) return { emailAnalistaAsignado: '', segmentoSheetColumn: '' };
      return {
        emailAnalistaAsignado: (currentFullData.nombreAgente || '').trim(),
        segmentoSheetColumn: (currentFullData.etapaFunel || '').trim()
      };
    }

    /** Promisifica google.script.run para usar async/await y encadenar llamadas con menos anidación. */
    function googleScriptRunAsync(methodName, arg) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[methodName](arg);
      });
    }

    /**
     * Arma el mismo payload que el envío real (sin adjuntos aún).
     * @returns {{ envio: object } | { error: string, message: string }}
     */
    function armarPayloadCorreoRenovacionCompleto() {
      var tipo = window._currentRenovacionCorreoAction;
      var base = window._pendingRenovacionDecisionPayload;
      if (!tipo || !base) {
        return { error: 'no_payload', message: 'No hay una gestión pendiente.' };
      }
      if (tipo === 'CORRECTION' || tipo === 'CANCELADA') {
        var mot = ($('#renovacionCorreoMotivo').val() || '').trim();
        if (!mot) {
          return { error: 'motivo', message: 'Indique el motivo u observaciones antes de validar o enviar.' };
        }
        base.observations = mot;
      }
      var ctx = buildRenovacionCorreoContext();
      var envio = Object.assign({}, base, {
        tipoAccionCorreo: tipo,
        decision: base.decision || (tipo === 'APPROVE' ? 'APPROVE' : tipo === 'CORRECTION' ? 'CORRECTION' : 'CANCELADA'),
        correoAdicional1: $('#renovacionCorreoExtra1').val(),
        correoAdicional2: $('#renovacionCorreoExtra2').val(),
        emailAnalistaAsignado: ctx.emailAnalistaAsignado,
        segmentoSheetColumn: ctx.segmentoSheetColumn,
        notasAnalista: $('#notasAnalista').val() || '',
        leadSelect: (currentFullData && currentFullData.leadSelect) ? currentFullData.leadSelect : {},
        ccSeleccionados: getSeleccionadosCorreoRenovacion(),
        manualPara: $('#renovacionCorreoPara').val(),
        manualAsunto: $('#renovacionCorreoAsunto').val()
      });
      if (tipo === 'CORRECTION') envio.segmento = resolverSegmentoParaCorreccion();
      return { envio: envio };
    }

    function resolverSegmentoParaCorreccion() {
      if (!currentFullData) return 'SIN SEGMENTO';
      if (currentFullData.dataLead && currentFullData.dataLead.segmento) return currentFullData.dataLead.segmento;
      if (currentFullData.etapaFunel) return currentFullData.etapaFunel;
      return 'SIN SEGMENTO';
    }

    function cerrarRenovacionCorreoOverlay() {
      var $ov = $('#renovacionCorreoOverlay');
      $ov.removeClass('is-open').attr('aria-hidden', 'true');
      window._pendingRenovacionDecisionPayload = null;
      window._currentRenovacionCorreoAction = null;
    }

    function openRenovacionCorreoOverlay(tipoAccion) {
      var titulos = {
        APPROVE: 'Correo: renovación aprobada / expedición',
        CORRECTION: 'Correo: solicitud de correcciones',
        CANCELADA: 'Correo: renovación declinada (imposible renovar)'
      };
      $('#renovacionCorreoTitulo').text(titulos[tipoAccion] || 'Vista previa del correo');
      var showMotivo = (tipoAccion === 'CORRECTION' || tipoAccion === 'CANCELADA');
      $('#rowRenovacionCorreoMotivo').toggleClass('d-none', !showMotivo);
      if (showMotivo) $('#renovacionCorreoMotivo').val('');
      $('#renovacionCorreoExtra1').val('');
      $('#renovacionCorreoExtra2').val('');
      window._renovacionCorreoAdjuntosUids = [];
      actualizarResumenAdjuntosCorreoRenovacion();
      $('#renovacionCorreoCandidatosContainer').html('<p class="text-muted small p-3 mb-0">Cargando contactos de la póliza…</p>');
      $('#renovacionCorreoAsignacionCorreccion').addClass('d-none').empty();
      window._currentRenovacionCorreoAction = tipoAccion;
      $('#renovacionCorreoOverlay').addClass('is-open').attr('aria-hidden', 'false');
      refreshRenovacionCorreoPreview(true);
    }

    function renderRenovacionCorreoAsignacionPanel(tipo, r) {
      var $box = $('#renovacionCorreoAsignacionCorreccion');
      if (!$box.length) return;
      if (tipo !== 'CORRECTION' || !r || !r.asignacionCorreccion) {
        $box.addClass('d-none').empty();
        return;
      }
      var a = r.asignacionCorreccion;
      var parts = [];
      parts.push('<div class="fw-semibold text-dark mb-1"><i class="bi bi-person-badge me-1"></i>Quién recibirá la corrección </div>');
      parts.push('<div class="text-muted mb-2">' + escapeHtmlRenovCorreoUi(a.colaLegible || a.cola || '') + '</div>');
      if (a.agentePrevisto && a.agentePrevisto.email) {
        parts.push(escapeHtmlRenovCorreoUi(a.agentePrevisto.nombre || '—'));
        parts.push(' <span class="text-muted">·</span> ');
        parts.push('<span class="text-break">' + escapeHtmlRenovCorreoUi(a.agentePrevisto.email) + '</span></div>');
      } else {
        parts.push('<div class="text-warning">No hay asesor con cupo en esta cola; en hoja quedará <span class="text-break">' + escapeHtmlRenovCorreoUi(a.emailEnHoja || 'sin.asignar@segurosbolivar.com') + '</span></div>');
      }
      if (a.agentesDisponibles && a.agentesDisponibles.length) {
        parts.push('<details class="mt-2 mb-0"><summary class="fw-semibold" style="cursor:pointer;">Asesores con cupo en la cola (' + a.agentesDisponibles.length + ')</summary><ul class="mb-0 mt-1 ps-3">');
        a.agentesDisponibles.forEach(function (ag) {
          parts.push('<li class="text-break">' + escapeHtmlRenovCorreoUi(ag.nombre || '') + ' — ' + escapeHtmlRenovCorreoUi(ag.email || '') + '</li>');
        });
        parts.push('</ul></details>');
      }
      $box.removeClass('d-none').html(parts.join(''));
    }

    function getSeleccionadosCorreoRenovacion() {
      var out = [];
      $('#renovacionCorreoCandidatosContainer .renov-correo-cb:checked').each(function () {
        var v = $(this).attr('data-correo');
        if (v) out.push(String(v).trim());
      });
      return out;
    }

    var __renovCorreoPvTimer = null;
    var __renovCorreoPvGen = 0;

    function normAsigTxtRenov(s) {
      return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
    }

    function getUsuariosAsignacionCacheRenov() {
      var m = window.RenovacionCorreoMetaInicial || {};
      return Array.isArray(m.usuariosAsignacion) ? m.usuariosAsignacion : [];
    }

    function validEmailRenovLocal(e) {
      if (!e || typeof e !== 'string') return false;
      var t = e.trim();
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t);
    }

    function emailPropietarioRenovLocal(dataLead) {
      var a = (dataLead && dataLead.email) ? String(dataLead.email).trim() : '';
      var b = (dataLead && dataLead.emailBrIn) ? String(dataLead.emailBrIn).trim() : '';
      if (validEmailRenovLocal(a)) return a.replace(/\s/g, '');
      if (validEmailRenovLocal(b)) return b.replace(/\s/g, '');
      return '';
    }

    function normalizeSegmentoRenovLocal(dataLead, segmentoSheetColumn, segmentoOverride) {
      var dl = dataLead && typeof dataLead === 'object' ? Object.assign({}, dataLead) : {};
      if (segmentoOverride != null && String(segmentoOverride).trim() !== '') dl.segmento = segmentoOverride;
      var raw = '';
      if (dl.segmento) raw = String(dl.segmento);
      else if (segmentoSheetColumn) raw = String(segmentoSheetColumn);
      var u = raw.toUpperCase().trim();
      if (!u || u.indexOf('SIN') === 0) return 'PROPIETARIO';
      if (u.indexOf('INMOBILIARIA') !== -1) return 'INMOBILIARIA';
      if (u.indexOf('BROKER') !== -1 || u.indexOf('BRÓKER') !== -1 || u.indexOf('BROK') !== -1) return 'BROKER';
      if (u.indexOf('PROPIETARIO') !== -1) return 'PROPIETARIO';
      return 'PROPIETARIO';
    }

    function filasActivasAsignRenov(usuarios) {
      var out = [];
      for (var i = 0; i < usuarios.length; i++) {
        if (normAsigTxtRenov(usuarios[i].estado) === 'activo') out.push(usuarios[i]);
      }
      return out;
    }

    function filtrarPerfilAsignRenov(activos, testFn) {
      var r = [];
      for (var i = 0; i < activos.length; i++) {
        if (testFn(normAsigTxtRenov(activos[i].perfil))) r.push(activos[i]);
      }
      return r;
    }

    function elegirUsuarioAnalistaRenov(candidatos, emailAnalistaAsignado) {
      if (!candidatos || !candidatos.length) return null;
      var e = String(emailAnalistaAsignado || '').toLowerCase().trim().replace(/\s/g, '');
      if (!e) return candidatos[0];
      var j, c;
      for (j = 0; j < candidatos.length; j++) {
        if (candidatos[j].correo.toLowerCase() === e) return candidatos[j];
      }
      var local = e.indexOf('@') > 0 ? e.split('@')[0] : '';
      for (j = 0; j < candidatos.length; j++) {
        c = candidatos[j].correo.toLowerCase();
        if (local && c.split('@')[0] === local) return candidatos[j];
      }
      return candidatos[0];
    }

    function buildRecipientPlanRenovLocal(segmentoNorm, dataLead, emailAnalistaAsignado) {
      var activos = filasActivasAsignRenov(getUsuariosAsignacionCacheRenov());
      var paraRows = filtrarPerfilAsignRenov(activos, function (np) {
        return np.indexOf('cuenta comercial') >= 0 || (np.indexOf('notificacion') >= 0 && np.indexOf('comercial') >= 0);
      });
      var para = paraRows.length ? String(paraRows[0].correo).trim().replace(/\s/g, '')
        : 'renovacionesarrendamiento@segurosbolivar.com';
      var cc = [];
      var ccMeta = [];
      if (segmentoNorm === 'PROPIETARIO') {
        var ep = emailPropietarioRenovLocal(dataLead);
        if (ep) {
          cc.push(ep);
          ccMeta.push({ nombre: 'Propietario / tomador', correo: ep, rol: 'CC segmento Propietario' });
        }
      } else if (segmentoNorm === 'BROKER') {
        var segBrokers = filtrarPerfilAsignRenov(activos, function (np) {
          return np.indexOf('segmento') >= 0 && np.indexOf('broker') >= 0;
        });
        var kb, emW;
        for (kb = 0; kb < segBrokers.length; kb++) {
          emW = String(segBrokers[kb].correo).trim().replace(/\s/g, '');
          if (validEmailRenovLocal(emW) && cc.indexOf(emW) === -1) {
            cc.push(emW);
            ccMeta.push({ nombre: segBrokers[kb].perfil || 'Notificación segmento Bróker', correo: emW, rol: 'CC segmento Bróker' });
          }
        }
        var ejRows = filtrarPerfilAsignRenov(activos, function (np) {
          if (np.indexOf('inmobiliaria') >= 0) return false;
          return np.indexOf('ejecutivo') >= 0 && np.indexOf('broker') >= 0;
        });
        var ejPick = elegirUsuarioAnalistaRenov(ejRows, emailAnalistaAsignado);
        if (ejPick && validEmailRenovLocal(ejPick.correo)) {
          var emE = String(ejPick.correo).trim().replace(/\s/g, '');
          if (cc.indexOf(emE) === -1) {
            cc.push(emE);
            ccMeta.push({ nombre: ejPick.perfil || 'Ejecutivo de cuenta', correo: emE, rol: 'CC ejecutivo cuenta Bróker' });
          }
        }
      } else if (segmentoNorm === 'INMOBILIARIA') {
        var segInm = filtrarPerfilAsignRenov(activos, function (np) {
          return np.indexOf('segmento') >= 0 && np.indexOf('inmobiliaria') >= 0;
        });
        var ki, emM;
        for (ki = 0; ki < segInm.length; ki++) {
          emM = String(segInm[ki].correo).trim().replace(/\s/g, '');
          if (validEmailRenovLocal(emM) && cc.indexOf(emM) === -1) {
            cc.push(emM);
            ccMeta.push({ nombre: segInm[ki].perfil || 'Notificación segmento Inmobiliaria', correo: emM, rol: 'CC segmento Inmobiliaria' });
          }
        }
        var ejInm = filtrarPerfilAsignRenov(activos, function (np) {
          return np.indexOf('ejecutivo') >= 0 && np.indexOf('inmobiliaria') >= 0;
        });
        var ejInmPick = elegirUsuarioAnalistaRenov(ejInm, emailAnalistaAsignado);
        if (ejInmPick && validEmailRenovLocal(ejInmPick.correo)) {
          var emEI = String(ejInmPick.correo).trim().replace(/\s/g, '');
          if (cc.indexOf(emEI) === -1) {
            cc.push(emEI);
            ccMeta.push({ nombre: ejInmPick.perfil || 'Ejecutivo de cuenta', correo: emEI, rol: 'CC ejecutivo cuenta Inmobiliaria' });
          }
        }
      }
      return { para: para, cc: cc, ccMeta: ccMeta, segmentoNorm: segmentoNorm };
    }

    function parseExtraCcRenovLocal(s1, s2) {
      var out = [];
      var parts = [];
      if (s1) parts = parts.concat(String(s1).split(/[;,]/));
      if (s2) parts = parts.concat(String(s2).split(/[;,]/));
      for (var i = 0; i < parts.length; i++) {
        var x = String(parts[i] || '').trim();
        if (validEmailRenovLocal(x) && out.indexOf(x) === -1) out.push(x.replace(/\s/g, ''));
      }
      return out;
    }

    function tituloCampoCorreoRenovLocal(key) {
      var k = String(key).toLowerCase();
      if (k === 'email') return 'Tomador / asegurado (correo principal)';
      if (k.indexOf('emailbrin') !== -1) return 'Arrendatario / contacto BrIn';
      if (k.indexOf('correobroker') !== -1 || k.indexOf('emailbroker') !== -1 || k.indexOf('correo_broker') !== -1 || k.indexOf('email_broker') !== -1) return 'Contacto bróker';
      if (k.indexOf('inmobiliaria') !== -1 && (k.indexOf('correo') !== -1 || k.indexOf('email') !== -1)) return 'Contacto inmobiliaria';
      if (k.indexOf('ejecutivo') !== -1 && (k.indexOf('correo') !== -1 || k.indexOf('email') !== -1)) return 'Ejecutivo comercial';
      if (k.indexOf('correo') !== -1 || k.indexOf('email') !== -1 || k.indexOf('mail') !== -1) return 'Contacto en datos (' + key + ')';
      return key;
    }

    function categoriaCampoCorreoRenovLocal(key) {
      var k = String(key).toLowerCase();
      if (k === 'email') return 'Propietario / tomador';
      if (k.indexOf('brin') !== -1) return 'Arrendatario';
      if (k.indexOf('broker') !== -1 || k.indexOf('corredor') !== -1) return 'Bróker';
      if (k.indexOf('inmobiliaria') !== -1) return 'Inmobiliaria';
      if (k.indexOf('ejecutivo') !== -1) return 'Ejecutivo';
      return 'Dato póliza';
    }

    function extraerCorreosObjetoPlanoRenov(obj, fuente, seen, candidatos) {
      if (!obj || typeof obj !== 'object') return;
      for (var key in obj) {
        if (!Object.prototype.hasOwnProperty.call(obj, key)) continue;
        var val = obj[key];
        if (val == null) continue;
        if (typeof val === 'string' && validEmailRenovLocal(val)) {
          var lk = String(key).toLowerCase();
          if (lk.indexOf('email') === -1 && lk.indexOf('correo') === -1 && lk.indexOf('mail') === -1) continue;
          var em = String(val).trim().replace(/\s/g, '');
          var low = em.toLowerCase();
          if (seen[low]) continue;
          seen[low] = true;
          candidatos.push({
            id: fuente + '_' + key + '_' + low.replace(/[^a-z0-9]/gi, '').substring(0, 14),
            correo: em,
            titulo: tituloCampoCorreoRenovLocal(key),
            categoria: categoriaCampoCorreoRenovLocal(key),
            campo: key,
            fuenteDatos: fuente
          });
        }
      }
    }

    function construirCandidatosCorreoRenovLocal(dataLead, leadSelect, plan) {
      var seen = {};
      var candidatos = [];
      extraerCorreosObjetoPlanoRenov(dataLead, 'Póliza (JSON fila)', seen, candidatos);
      extraerCorreosObjetoPlanoRenov(leadSelect || {}, 'Gestión / oferta', seen, candidatos);
      var i, m, em, low, j;
      for (i = 0; i < plan.ccMeta.length; i++) {
        m = plan.ccMeta[i];
        em = String(m.correo || '').trim().replace(/\s/g, '');
        if (!validEmailRenovLocal(em)) continue;
        low = em.toLowerCase();
        if (seen[low]) {
          for (j = 0; j < candidatos.length; j++) {
            if (candidatos[j].correo.toLowerCase() === low) {
              if (m.rol) candidatos[j].titulo += ' · ' + m.rol;
              break;
            }
          }
          continue;
        }
        seen[low] = true;
        candidatos.push({
          id: 'regla_' + i + '_' + low.replace(/[^a-z0-9]/gi, '').substring(0, 12),
          correo: em,
          titulo: m.nombre || 'Destinatario por regla de segmento',
          categoria: 'Regla / segmento',
          rolDetalle: m.rol || '',
          fuenteDatos: 'parametrizado'
        });
      }
      var planEmails = {};
      for (var p = 0; p < plan.cc.length; p++) {
        planEmails[String(plan.cc[p]).toLowerCase()] = true;
      }
      for (var c = 0; c < candidatos.length; c++) {
        candidatos[c].incluidoPorDefecto = !!planEmails[candidatos[c].correo.toLowerCase()];
      }
      return candidatos;
    }

    function aplicarSeleccionCandidatosRenov(candidatos, ccSeleccionados, usarDefecto) {
      for (var i = 0; i < candidatos.length; i++) {
        var eml = candidatos[i].correo.toLowerCase();
        if (usarDefecto) {
          candidatos[i].seleccionado = !!candidatos[i].incluidoPorDefecto;
        } else {
          candidatos[i].seleccionado = false;
          for (var s = 0; s < ccSeleccionados.length; s++) {
            if (String(ccSeleccionados[s] || '').trim().toLowerCase() === eml) {
              candidatos[i].seleccionado = true;
              break;
            }
          }
        }
      }
    }

    function ccFinalDesdeCandidatosRenov(candidatos, extras, paraEmail) {
      var cc = [];
      var paraLow = String(paraEmail || '').toLowerCase().trim();
      for (var i = 0; i < candidatos.length; i++) {
        if (!candidatos[i].seleccionado) continue;
        var em = candidatos[i].correo;
        if (em.toLowerCase() === paraLow) continue;
        if (cc.indexOf(em) === -1) cc.push(em);
      }
      for (var e = 0; e < extras.length; e++) {
        var x = extras[e];
        if (!x || String(x).toLowerCase() === paraLow) continue;
        if (cc.indexOf(x) === -1) cc.push(x);
      }
      return cc;
    }

    function aplicarVistaPreviaRenovCorreo(primeraCarga) {
      var tipo = window._currentRenovacionCorreoAction;
      if (!tipo || !currentFullData || !currentFullData.dataLead) return;
      var ctx = buildRenovacionCorreoContext();
      var obsMotivo = $('#renovacionCorreoMotivo').val() || '';
      var notas = $('#notasAnalista').val() || '';
      var obsForPreview = (tipo === 'APPROVE') ? (notas || 'Renovación aprobada') : obsMotivo;
      var dataLead = currentFullData.dataLead;
      var leadSelect = currentFullData.leadSelect || {};
      var segOv = (tipo === 'CORRECTION') ? resolverSegmentoParaCorreccion() : null;
      var seg = normalizeSegmentoRenovLocal(dataLead, ctx.segmentoSheetColumn, segOv);
      var plan = buildRecipientPlanRenovLocal(seg, dataLead, ctx.emailAnalistaAsignado);
      var extra = parseExtraCcRenovLocal($('#renovacionCorreoExtra1').val(), $('#renovacionCorreoExtra2').val());
      var candidatos = construirCandidatosCorreoRenovLocal(dataLead, leadSelect, plan);
      var hayCbs = $('#renovacionCorreoCandidatosContainer .renov-correo-cb').length > 0;
      var rawSel = null;
      if (!primeraCarga && hayCbs) rawSel = getSeleccionadosCorreoRenovacion();
      var usarDefecto = (rawSel === undefined || rawSel === null);
      aplicarSeleccionCandidatosRenov(candidatos, usarDefecto ? [] : rawSel, usarDefecto);
      var ccFinal = ccFinalDesdeCandidatosRenov(candidatos, extra, plan.para);
      var poliza = String(dataLead.poliza != null ? dataLead.poliza : '');
      var fechaStr = new Date().toISOString().slice(0, 16).replace('T', ' ');
      var vars = {
        POLIZA: poliza,
        ASEGURADO: dataLead.asegurado || '',
        DOCUMENTO: dataLead.documento != null ? dataLead.documento : '',
        SEGMENTO: seg,
        NOTAS: tipo === 'APPROVE' ? (notas || obsForPreview || '—') : (notas || '—'),
        OBSERVACIONES: obsForPreview || '—',
        FECHA_ENVIO: fechaStr
      };
      var htmlBody = htmlBodyRenovCorreoLocal(tipo, vars);
      var subject = subjectRenovacionLocal(tipo, poliza);
      var asignacionCorreccion = (tipo === 'CORRECTION') ? asignacionCorreccionDesdeCacheRenov(seg) : null;
      var r = {
        success: true,
        subject: subject,
        para: plan.para,
        cc: ccFinal,
        candidatos: candidatos,
        segmentoNorm: seg,
        htmlBody: htmlBody,
        asignacionCorreccion: asignacionCorreccion
      };
      if (primeraCarga) {
        $('#renovacionCorreoPara').val(r.para || '');
        $('#renovacionCorreoAsunto').val(r.subject || '');
      }
      $('#renovacionCorreoSegmentoBadge').text(r.segmentoNorm || '—');
      renderRenovacionCorreoAsignacionPanel(tipo, r);
      renderRenovacionCorreoCandidatos(r.candidatos || []);
      var iframe = document.getElementById('renovacionCorreoIframe');
      if (iframe) iframe.srcdoc = r.htmlBody || '<p>Sin contenido</p>';
    }

    function scheduleRenovacionCorreoPreview(primeraCarga) {
      if (primeraCarga) {
        __renovCorreoPvGen++;
        aplicarVistaPreviaRenovCorreo(true);
        return;
      }
      clearTimeout(__renovCorreoPvTimer);
      var g = ++__renovCorreoPvGen;
      __renovCorreoPvTimer = setTimeout(function () {
        if (g !== __renovCorreoPvGen) return;
        aplicarVistaPreviaRenovCorreo(false);
      }, 160);
    }

    function renderRenovacionCorreoCandidatos(candidatos) {
      var $c = $('#renovacionCorreoCandidatosContainer').empty();
      if (!candidatos || !candidatos.length) {
        $c.append('<p class="text-muted small p-3 mb-0">No se hallaron correos en el JSON de la póliza. Use los campos adicionales o revise los datos del lead.</p>');
        return;
      }
      candidatos.forEach(function (c, idx) {
        var id = 'renov-correo-cb-' + idx;
        var esRegla = (c.fuenteDatos === 'parametrizado' || (c.id && String(c.id).indexOf('regla_') === 0));
        var $row = $('<div class="renov-correo-row d-flex align-items-start gap-2 py-2 px-2 border-bottom"></div>');
        var $chk = $('<input type="checkbox" class="form-check-input renov-correo-cb mt-1 flex-shrink-0">')
          .attr('id', id)
          .attr('data-correo', c.correo || '')
          .attr('data-es-regla', esRegla ? '1' : '0')
          .prop('checked', !!c.seleccionado);
        var $lab = $('<label class="form-check-label flex-grow-1 mb-0" style="cursor:pointer;"></label>').attr('for', id);
        var badgeExtra = 'bg-secondary';
        var cat = (c.categoria || '').toLowerCase();
        if (cat.indexOf('propietario') !== -1 || cat.indexOf('tomador') !== -1) badgeExtra = 'bg-primary';
        else if (cat.indexOf('bróker') !== -1 || cat.indexOf('broker') !== -1) badgeExtra = 'bg-dark';
        else if (cat.indexOf('inmobiliaria') !== -1) badgeExtra = 'bg-info text-dark';
        else if (cat.indexOf('arrendatario') !== -1) badgeExtra = 'bg-success';
        else if (cat.indexOf('regla') !== -1 || cat.indexOf('param') !== -1) badgeExtra = 'bg-warning text-dark';
        $lab.append($('<span class="badge me-1"></span>').addClass(badgeExtra).text(c.categoria || 'Contacto'));
        $lab.append($('<strong class="d-block"></strong>').text(c.titulo || ''));
        $lab.append($('<span class="small text-break text-muted d-block"></span>').text(c.correo || ''));
        if (c.fuenteDatos) {
          var $fuente = $('<div class="small text-muted mt-1"></div>');
          $fuente.append($('<i class="bi bi-database me-1"></i>'));
          $fuente.append($('<span></span>').text(c.fuenteDatos));
          $lab.append($fuente);
        }
        $row.append($chk).append($lab);
        $c.append($row);
      });
    }

window.markAsReviewed = async function() {
    console.log("Iniciando marcado de revisión...");

    // 1. Validación visual
    if ($('#confidenceScore').text() === '0%') {
        Swal.fire('Atención', 'No hay gestión documental para marcar como revisado.', 'warning');
        return;
    }

    Swal.fire({
        title: '¿Marcar como Revisado?',
        text: "El caso quedará en estado 'Caso Revisado' listo para emisión futura.",
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Sí, marcar',
        confirmButtonColor: '#ffc107',
        cancelButtonText: 'Cancelar'
    }).then(async (result) => {
        if (result.isConfirmed) {
            Swal.fire({ title: 'Guardando...', html: 'Procesando información...', didOpen: () => Swal.showLoading() });

            try {
 
                let filesToSend = {};
                for (const key of DOC_KEYS) {
                    if (docState[key] && docState[key].file) {
                        try {
                            filesToSend[key] = await readFileAsBase64(docState[key].file);
                        } catch (e) { console.error("Error leyendo archivo local " + key); }
                    }
                }

                let driveRefs = {};
                for (const key of DOC_KEYS) {
                    if (docState[key] && docState[key].isDrive && docState[key].url) {
                        driveRefs[key] = { url: docState[key].url, name: key };
                    }
                }
 
                const dataLeadReal = (currentFullData && currentFullData.dataLead) ? currentFullData.dataLead : {};
                const idParaBackend = dataLeadReal.poliza || dataLeadReal.solicitud || 'SIN_ID';

                // Payload Corregido
                let payload = {
                    leadId: idParaBackend,      
                    dataLead: dataLeadReal,    
                    decision: 'REVIEWED',        
                    observations: $('#notasAnalista').val() || "Caso marcado como revisado.",
                    files: filesToSend,
                    driveRefs: driveRefs,
                    manualUpdates: {
                        nuevoCanon: $('#db_NUEVO_CANON_SOLO').val(),
                        nuevaVigenciaInicio: $('#fechaInicioVigencia').val(),
                        nuevaVigenciaFin: $('#fechaFinVigencia').val()
                    }
                };

                // 4. Enviar al Backend
                google.script.run
                    .withSuccessHandler((res) => {
                        Swal.fire('Guardado', 'Caso marcado como REVISADO.', 'success');
                        $('#modalGestionDocumentalIA').modal('hide');
                        if(typeof ReloadRenovacionesTable === 'function') ReloadRenovacionesTable();
                    })
                    .withFailureHandler((err) => {
                        Swal.close();
                        Swal.fire('Error', 'Fallo al guardar: ' + err.message, 'error');
                    })
                    .processAnalystDecision(payload);

            } catch (errorGeneral) {
                console.error(errorGeneral);
                Swal.fire('Error Cliente', 'Ocurrió un error preparando los datos.', 'error');
            }
        }
    });
};

    function ReorganizeData(Data) {
      return Data.map(row => [
        row[0],  // Fecha Radicado
        row[1],  // Nombre del Cliente
        row[2],  // Ciudad
        row[3],  // Estado
        row[4],  // Veces Gestión
        row[8],  // Ref (antes estaba en la posición 8)
        row[5],   // Acción
        ...row.slice(7)
      ]);
    }

    var TablaGestionDoc = null;
    var TableRenderBrokers = null;

    // Mapa global: guarda los datos originales de cada fila por índice
    window._pendingRowsMap = {};
    window._pendingRowsType = {};

    function CreatePendingTable(Data, DataBrokers) {
      DataBrokers = DataBrokers || [];

      // Limpiar mapa
      window._pendingRowsMap = {};
      window._pendingRowsType = {};

      var unifiedData = [];
      var idx = 0;

      // Agregar leads internos (ya reorganizados)
      Data.forEach(function(row) {
        window._pendingRowsMap[idx] = row;
        window._pendingRowsType[idx] = "gestiondocumental";
        unifiedData.push([
          row[0],                    // Fecha Radicado
          row[1],                    // Nombre del Cliente
          row[2],                    // Ciudad
          row[3] || "",              // Estado
          "Gestión Documental",      // Origen
          idx                        // ID interno (para el botón)
        ]);
        idx++;
      });

      // Agregar leads de broker (datos crudos, sin reorganizar)
      DataBrokers.forEach(function(row) {
        window._pendingRowsMap[idx] = row;
        window._pendingRowsType[idx] = "broker-inmobiliaria";
        unifiedData.push([
          row[0],                    // Fecha Radicado
          row[1],                    // Nombre del Cliente
          row[2],                    // Ciudad
          row[4] || "",              // Tipo Cliente
          "Broker / Inmobiliaria",   // Origen
          idx                        // ID interno (para el botón)
        ]);
        idx++;
      });

      var TotalPending = unifiedData.length;

        columns: [
          { title: "Fecha Radicado" },
          { title: "Nombre del Cliente" },

          { title: "Origen" },

              return '<button type="button" onclick="AbrirGestion(' + data + ')" class="btn btn-black btn-rounded"><span class="btn-label"><i class="bi bi-hand-index-thumb"></i></span>Gestionar</button>';
            }
          }
        ],
        order: [],
        lengthMenu: [[5, 10, 25, 50, 100], [5, 10, 25, 50, 100]],
        columnDefs: [
          { targets: "_all", className: "text-center" }
        ],
        language: {
          emptyTable: "No hay solicitudes pendientes por gestionar."
        }
      });

      $("#Total_Length_Clients").text(TotalPending);
      $.notify({
        icon: 'bi bi-bell-fill',
        title: 'Recordatorio',
        message: '<b>Tienes ' + TotalPending + ' solicitudes pendientes por gestionar.</b>',
      }, {
        type: 'warning',

          align: "right"
        },
        time: 1000,

    };

    function ValuesCotizacion(Canon, Admon, FuncionarioBolivar, MesesVigencia) {
      var Tasa;
      if (FuncionarioBolivar == "Si") {
        Tasa = 0.03;
      } else if (FuncionarioBolivar == "No") {
        Tasa = 0.035;
      }
      var CanonAdmon = Canon + Admon;
      MesesVigencia = parseInt(MesesVigencia);
      var TotalAsegurado = CanonAdmon * MesesVigencia;
      var PrimaNeta = +TotalAsegurado * Tasa;
      var Iva19 = (PrimaNeta * 0.19);
      var PrimaPagar = parseInt(PrimaNeta + Iva19);
      return [PrimaPagar, TotalAsegurado]
    }

    function simulateTyping(mensajeTexto, text) {
      let index = 0;
      const speed = 25; // Velocidad de escritura en milisegundos
      function type() {
        if (index < text.length) {
          mensajeTexto.append(text.charAt(index));
          index++;
          setTimeout(type, speed);
        }
      }
      type();
    }

function extractDriveIdFromUrlRenov(url) {
  if (!url) return null;
  var m = String(url).match(/[-\w]{25,}/);
  return (m && m[0]) ? m[0] : null;
}

function construirListaAdjuntosDisponiblesCorreo() {
  var items = [];
  var seenDriveIds = {};

  DOC_KEYS.forEach(function (key) {
    var st = docState[key];
    if (!st || st.isOmitted) return;
    var titulo = DOC_KEY_LABELS[key] || key;
    if (st.isDrive && st.url) {
      var fid = extractDriveIdFromUrlRenov(st.url);
      if (fid && !seenDriveIds[fid]) {
        seenDriveIds[fid] = true;
        var nm = ($('#name-' + key).text() || titulo).trim();
        items.push({
          uid: 'card-drive-' + key,
          fileId: fid,
          nombre: nm,
          titulo: titulo,
          origen: 'Tarjeta documental (Drive)'
        });
      }
    } else if (st.file) {
      items.push({
        uid: 'card-local-' + key,
        docKey: key,
        nombre: st.file.name || titulo,
        titulo: titulo,
        origen: 'Tarjeta documental (equipo)'
      });
    }
  });

  if (currentClientDriveFiles && currentClientDriveFiles.length) {
    currentClientDriveFiles.forEach(function (f, idx) {
      var fid = null;
      if (f.id && String(f.id).indexOf('legacy_') !== 0) {
        fid = String(f.id).trim();
      } else if (f.url) {
        fid = extractDriveIdFromUrlRenov(f.url);
      }
      if (!fid || seenDriveIds[fid]) return;
      seenDriveIds[fid] = true;
      items.push({
        uid: 'drive-list-' + idx,
        fileId: fid,
        nombre: f.name || 'documento',
        titulo: f.name || 'Archivo Drive',
        origen: f.context || 'Carpeta / historial'
      });
    });
  }

  return items;
}

function escapeHtmlRenovCorreoUi(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

  var uids = window._renovacionCorreoAdjuntosUids || [];

async function construirPayloadAdjuntosCorreoRenovacionAsync() {
  var uids = window._renovacionCorreoAdjuntosUids || [];
  if (!uids.length) return [];
  var catalogo = construirListaAdjuntosDisponiblesCorreo();
  var map = {};
  catalogo.forEach(function (it) { map[it.uid] = it; });
  var out = [];
  var seenDrive = {};
  var seenLocalKey = {};
  for (var i = 0; i < uids.length; i++) {
    var it = map[uids[i]];
    if (!it) continue;
    if (it.fileId) {
      if (seenDrive[it.fileId]) continue;
      seenDrive[it.fileId] = true;
      out.push({
        tipo: 'drive',
        fileId: it.fileId,
        nombre: (it.nombre || 'documento').substring(0, 180)
      });
    } else if (it.docKey && docState[it.docKey] && docState[it.docKey].file) {
      if (seenLocalKey[it.docKey]) continue;
      seenLocalKey[it.docKey] = true;
      try {
        var b64 = await readFileAsBase64(docState[it.docKey].file);
        out.push({
          tipo: 'base64',
          nombre: (b64.name || it.nombre || 'documento').substring(0, 180),
          mimeType: b64.mimeType || 'application/octet-stream',
          data: b64.data
        });
      } catch (e) {
        console.error('Adjunto local omitido', e);
      }
    }
  }
  return out;
}

  function renderizarPDFCompleto(file) {
    var wrapper = document.getElementById('pdf-pages-wrapper');

    fileReader.onload = function () {
      var typedarray = new Uint8Array(this.result);

      pdfjsLib.getDocument(typedarray).promise.then(function (pdf) {
        wrapper.innerHTML = '';

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {

          let canvas = document.createElement('canvas');
          canvas.id = 'pdf-page-' + pageNum;
          canvas.className = 'pdf-canvas mb-4 shadow-sm'; 
          canvas.style.maxWidth = '100%';
          canvas.style.display = 'block';
          canvas.style.margin = '0 auto 20px auto';  

          wrapper.appendChild(canvas);

          pdf.getPage(pageNum).then(function (page) {
            var scale = 1.5; 
            var viewport = page.getViewport({ scale: scale });
            var ctx = canvas.getContext('2d');

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            var renderContext = {
              canvasContext: ctx,
              viewport: viewport
            };
            page.render(renderContext);
          });
        }
      }).catch(function (error) {
        console.error('Error PDF:', error);
        wrapper.innerHTML = '<div class="alert alert-danger">El PDF está dañado o tiene contraseña.</div>';
      });
    };

    fileReader.readAsArrayBuffer(file);

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => {
        let encoded = reader.result.toString().replace(/^data:(.*,)?/, '');
        if ((encoded.length % 4) > 0) {
          encoded += '='.repeat(4 - (encoded.length % 4));
        }
        
        resolve({
          data: encoded,
          mimeType: file.type,
          name: file.name
        });
      };
      reader.onerror = error => reject(error);
    });
  }


function extractEmbeddedFiles(jsonData) {
    let embeddedFiles = [];
     
    const keyMap = {
        'sarlaft': { type: 'sarlaft', context: 'Base de Datos (Legacy)' },
        'sarlaftArchivoURL': { type: 'sarlaft', context: 'Base de Datos' },
        'formatoRenovacion': { type: 'poliza', context: 'Formato Renovación' }, 
        'cedula': { type: 'cedula', context: 'Base de Datos' },
        'pazYsalvo': { type: 'pazYsalvo', context: 'Base de Datos' },
        'poliza': { type: 'poliza', context: 'Base de Datos' }
    };

    const dataSources = [jsonData.dataLead, jsonData.leadSelect];

    dataSources.forEach(source => {
        if (!source) return;

        Object.keys(source).forEach(key => {
            if (keyMap[key] && source[key]) {
                let rawValue = String(source[key]);
     
                let urls = rawValue.match(/\bhttps?:\/\/\S+/gi);
                
                if (urls) {
                    urls.forEach((url, index) => {
                        let cleanUrl = url.replace(/,$/, '').trim();
                        
                        embeddedFiles.push({
                            id: `legacy_${key}_${index}`, 
                            name: `${keyMap[key].type.toUpperCase()}_BD_${index + 1}.pdf`, // Nombre generado
                            mimeType: 'application/pdf',
                            url: cleanUrl,
                            size: 'Enlace Externo',
                            date: new Date().toISOString(),
                            context: keyMap[key].context 
                        });
                    });
                }
            }
        });
    });

    return embeddedFiles;
}

function convertirFechaParaInput(fechaTexto) {
    if (!fechaTexto) return '';
    if (fechaTexto.match(/^\d{4}-\d{2}-\d{2}$/)) return fechaTexto;
    const partes = fechaTexto.split('/'); // [cite: 75]
    if (partes.length === 3) {
      const dia = partes[0].padStart(2, '0');
      const mes = partes[1].padStart(2, '0');
      const anio = partes[2];
      return `${anio}-${mes}-${dia}`;

    return '';

function validarYCalcularFechas() {
    const elInicio = document.getElementById('fechaInicioVigencia');
    const elFin = document.getElementById('fechaFinVigencia');

    if (!elInicio || !elFin) return;

    if (elInicio.value && !elFin.value) {
        const fInicio = new Date(elInicio.value + 'T00:00:00');
        const fFin = new Date(fInicio);
        fFin.setFullYear(fFin.getFullYear() + 1);
        elFin.value = fFin.toISOString().split('T')[0];
    }

    const inputInicio = elInicio.value;
    const inputFin = elFin.value;

    if (!inputInicio || !inputFin) return;

    const fInicio = new Date(inputInicio + 'T00:00:00');
    const fFin = new Date(inputFin + 'T00:00:00');

    // Validación básica: Fin no puede ser menor a Inicio
    if (fFin <= fInicio) {
        $('#displayMeses').text("Fecha Inválida");
        $('#alertaVigencia').removeClass('d-none').text("La fecha fin debe ser mayor al inicio");
        return;
    }

    // Calcular Meses exactos
    let meses = (fFin.getFullYear() - fInicio.getFullYear()) * 12;
    meses -= fInicio.getMonth();
    meses += fFin.getMonth();
    
    // Ajuste fino por días
    if (fFin.getDate() < fInicio.getDate()) meses--;

    // Calcular días totales
    const diffTime = Math.abs(fFin - fInicio);
    const dias = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    // Actualizar UI
    $('#displayMeses').text(meses + " Meses");
    $('#displayDias').text(dias + " Días");
    
    // Guardar meses calculados para la fórmula de cotización
    $('#formularioNuevaPoliza').data('meses-calculados', meses);

    // Alerta visual si es muy corto (tu lógica existente)
    if (meses < 5) {
         $('#alertaVigencia').removeClass('d-none').html('<i class="fas fa-ban me-1"></i> Vigencia inferior a 5 meses.');
         // No bloqueamos, pero avisamos
    } else {
         $('#alertaVigencia').addClass('d-none');
    }

    // Recalcular cotización con la nueva vigencia
    calcularCotizacion();
}

    let canonBaseHistorico = $('#formularioNuevaPoliza').data('base-canon-historico');

    if (!canonBaseHistorico) {
         let rootData = (typeof currentLeadData !== 'undefined' && currentLeadData.leadData) ? currentLeadData.leadData : {};
         let original = rootData.dataLead || {}; 
         canonBaseHistorico = parsearMoneda(original.canon) || 0;

    // 4. CALCULAR Y MOSTRAR

    }

      input.value = valor === 0 ? "" : formatearMoneda(valor);
  }

function calcularCotizacion() {
    // 0. LIMPIEZA VISUAL (ADIÓS AL "AZUL PAILA")
    // Cambiamos el estilo del badge de IPC a algo neutro y elegante
    $('#badgeIPC')
        .removeClass('bg-primary bg-opacity-10 text-primary') // Quita el azul
        .addClass('bg-light text-secondary border');          // Pone gris suave

    if (!$('#alertaVigencia').hasClass('d-none') && !$('#alertaVigencia').hasClass('hidden')) return;

    // 1. GESTIÓN DEL IVA COMERCIAL
    const tipoServ = $('#tipoServicio').val(); 
    if (tipoServ === 'COMERCIO') {
        $('#container_iva_comercial').show(); 
    } else {
        $('#container_iva_comercial').hide();
        $('#db_IVACOMERCIAL').val('$0'); 
    }

    // 2. OBTENER VALORES (Inputs)
    const valCanonSolo = parsearMoneda($('#db_NUEVO_CANON_SOLO').val()) || 0;
    const valAdmon = parsearMoneda($('#db_NUEVA_ADMINISTRACION').val()) || 0;
    const valIvaComercial = parsearMoneda($('#db_IVACOMERCIAL').val()) || 0; 

    // 3. BASE ASEGURABLE (FACTO: El IVA Comercial hace parte de la base del contrato)
    // La suma se hace AQUÍ sobre la base de cotización mensual
    const valCanonAdmon = valCanonSolo + valAdmon + valIvaComercial;

    const valServicios = parsearMoneda($('#nuevosServicios').val()) || 0;
    const valDyF = parsearMoneda($('#nuevosDyF').val()) || 0;
    
    // Si no se han calculado meses (carga inicial), asumimos 12
    const meses = $('#formularioNuevaPoliza').data('meses-calculados') || 12;

    // =========================================================
    // 4. CÁLCULOS (PRIMAS)
    // =========================================================

    // --- A. CANON (Base Total * Meses * Tasa) ---
    const aseguradoCanon = valCanonAdmon * meses; 
    const primaNetaCanon = aseguradoCanon * TASA_CANON; // 3.5%
    const ivaCanon = primaNetaCanon * IVA; // 19%
    const totalCanon = primaNetaCanon + ivaCanon; 

    // --- B. SERVICIOS PÚBLICOS ---
    let primaNetaServ = 0;
    let baseServicios = 0;
    
    // Deducibles
    if (tipoServ === 'VIVIENDA') {
        baseServicios = Math.max(0, valServicios - 1000000); 
    } else {
        baseServicios = Math.max(0, valServicios - 2000000); 
    }
    
    if (baseServicios > 0) {
        primaNetaServ = baseServicios * TASA_SERV_UNIFICADA; // 0.05
    }

    const ivaServ = primaNetaServ * IVA;
    const totalServ = primaNetaServ + ivaServ;

    // --- C. DAÑOS Y FALTANTES ---
    let primaNetaDyF = 0;
    let ivaDyF = 0;
    let totalDyF = 0;

    if (valDyF > 0) {
        if (valDyF < MIN_DYF) {
             $('#nuevosDyF').addClass('is-invalid'); 
             $('#card_total_dyf').text("Mín $1M").addClass('text-danger');
        } else {
             $('#nuevosDyF').removeClass('is-invalid');
             const aseguradoDyF = valDyF;
             primaNetaDyF = aseguradoDyF * TASA_DYF; // 5%
             ivaDyF = primaNetaDyF * IVA;
             totalDyF = primaNetaDyF + ivaDyF;
        }
    } else {
        $('#nuevosDyF').removeClass('is-invalid');
    }

    // =========================================================
    // 5. ACTUALIZACIÓN UI
    // =========================================================

    // Tarjeta Canon (Valores Base)
    // Muestra la Base Mensual Total (Canon + Admon + IvaCom)
    $('#card_base_total').text(formatearMoneda(valCanonAdmon)); 
    
    $('#card_prima_canon').text(formatearMoneda(Math.round(primaNetaCanon)));
    $('#card_iva_canon').text(formatearMoneda(Math.round(ivaCanon)));
    $('#card_total_canon').text(formatearMoneda(Math.round(totalCanon))); 

    // Tarjeta Servicios
    const textoTasaFija = (TASA_SERV_UNIFICADA * 100).toFixed(2) + '%';
    $('#card_tasa_serv').text(textoTasaFija).removeClass('text-danger').addClass('text-dark');
    $('#card_prima_serv').text(formatearMoneda(Math.round(primaNetaServ)));
    $('#card_iva_serv').text(formatearMoneda(Math.round(ivaServ)));
    $('#card_total_serv').text(formatearMoneda(Math.round(totalServ)));

    // Tarjeta DyF
    if (valDyF >= MIN_DYF || valDyF === 0) {
        $('#card_prima_dyf').text(formatearMoneda(Math.round(primaNetaDyF)));
        $('#card_iva_dyf').text(formatearMoneda(Math.round(ivaDyF)));
        $('#card_total_dyf').text(formatearMoneda(Math.round(totalDyF))).removeClass('text-danger');
    }

    // Total Final (Footer)
    const granTotal = totalCanon + totalServ + totalDyF;
    $('#cotizacionTotalFooter').text(formatearMoneda(Math.round(granTotal)));
    $('#valor_total_cotizacion').val(Math.round(granTotal)); 

    // Checkbox de control
    if (granTotal > 0 && !(valDyF > 0 && valDyF < MIN_DYF)) {
        $('#check-poliza').prop('checked', true);
    } else {
        $('#check-poliza').prop('checked', false);
    }
}

function formatCurrencyInput(input) {
      let value = input.value.replace(/\D/g, "");
    if (value === "") {
        input.value = "";
        return;
    }
    let numberVal = parseFloat(value);
    let formatted = new Intl.NumberFormat('es-CO', {
        style: 'currency',
        currency: 'COP',
        maximumFractionDigits: 0
    }).format(numberVal);
    input.value = formatted;
}


function parsearMoneda(valor) {
    if (!valor) return 0;
    let str = String(valor);

    let limpio = str.replace(/[^\d]/g, '');
    return limpio ? parseInt(limpio, 10) : 0;
}

            if (Data && Data[0] === "Autenticado") {

                window.LastGetDataUserResponse = Data;
                if (Data.length > 4 && Data[4]) {
                  window.RenovacionCorreoMetaInicial = Data[4];
                }

                // 1. Actualizar la variable Global con la nueva data fresca de BD
                window.DataRenovacionesGlobal = Data[1];

                // 2. Extraer los arrays actualizados
                let pendientes = window.DataRenovacionesGlobal.pendientes || [];
                let especiales = window.DataRenovacionesGlobal.especiales || [];
                let renovadas  = window.DataRenovacionesGlobal.renovadas || [];

                $("#TotalExpedicion").text(pendientes.length);
                $("#TotalEspeciales").text(especiales.length);
                $("#TotalRenovadas").text(renovadas.length);
                
                // Si usas los IDs de KPI específicos del analista:
                $("#kpiAnaPendientes").text(pendientes.length);
                $("#kpiAnaEspeciales").text(especiales.length);
                $("#kpiAnaRenovadas").text(renovadas.length);

                // 4. DESTRUIR Y LIMPIAR LA TABLA (Requisito explícito)
                if ($.fn.DataTable.isDataTable('#Table_Renovaciones')) {
                    $('#Table_Renovaciones').DataTable().destroy();
                    $('#Table_Renovaciones tbody').empty(); // Limpieza extra del DOM
                }

                // 5. RENDERIZAR DE NUEVO
                // Por defecto cargamos la vista de "Pendientes" tras una acción para que el usuario siga trabajando
                // Si quieres mantener la vista actual, necesitarías una variable global 'currentViewType'
                RenderRenovacionesTable(pendientes);
                
                console.log("✅ Tabla y KPIs actualizados correctamente.");

            } else {
                console.error("Error al recargar: Usuario no autenticado o data inválida.");
            }
        })
        .withFailureHandler(function(e) {
            console.error("Error crítico recargando tabla:", e);
            Swal.fire('Error', 'No se pudieron actualizar los datos.', 'error');
        })
        .GetDataUser();
};

  function formatearMiles(valor) {
    var formato = valor.toString().split(".");
    formato[0] = formato[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    formato = formato.join(".");
    return formato;
  }
  function formatearMoneda(valor) {
    if (valor === undefined || valor === null || isNaN(valor)) return '$0';
    return new Intl.NumberFormat('es-CO', { 
        style: 'currency', 
        currency: 'COP', 
        maximumFractionDigits: 0 
    }).format(valor);
}

  function formatNumberInput(input) {
    const value = input.value.replace(/[^0-9]/g, '');
    const formattedValue = Number(value) > 999 ? '$' + new Intl.NumberFormat('es-ES').format(Number(value)) : value;
    input.value = formattedValue;
  };

  function validateNumericInput(event) {
    const charCode = event.which || event.keyCode;
    if (!(charCode >= 48 && charCode <= 57) && charCode !== 8 && charCode !== 0) {
      event.preventDefault();
    }
  };
