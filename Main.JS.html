window.markAsReviewed = async function() {
    console.log("Iniciando marcado de revisión...");

    // 1. Validación visual
    if ($('#confidenceScore').text() === '0%') {
        Swal.fire('Atención', 'No hay gestión documental para marcar como revisado.', 'warning');
        return;
    }

    Swal.fire({
        title: '¿Marcar como Revisado?',
        text: "El caso quedará en estado 'Caso Revisado' listo para emisión futura.",
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Sí, marcar',
        confirmButtonColor: '#ffc107',
        cancelButtonText: 'Cancelar'
    }).then(async (result) => {
        if (result.isConfirmed) {
            Swal.fire({ title: 'Guardando...', html: 'Procesando información...', didOpen: () => Swal.showLoading() });

            try {
 
                let filesToSend = {};
                for (const key of DOC_KEYS) {
                    if (docState[key] && docState[key].file) {
                        try {
                            filesToSend[key] = await readFileAsBase64(docState[key].file);
                        } catch (e) { console.error("Error leyendo archivo local " + key); }
                    }
                }

                let driveRefs = {};
                for (const key of DOC_KEYS) {
                    if (docState[key] && docState[key].isDrive && docState[key].url) {
                        driveRefs[key] = { url: docState[key].url, name: key };
                    }
                }
 
                const dataLeadReal = (currentFullData && currentFullData.dataLead) ? currentFullData.dataLead : {};
                const idParaBackend = dataLeadReal.poliza || dataLeadReal.solicitud || 'SIN_ID';

                // Payload Corregido
                let payload = {
                    leadId: idParaBackend,      
                    dataLead: dataLeadReal,    
                    decision: 'REVIEWED',        
                    observations: $('#notasAnalista').val() || "Caso marcado como revisado.",
                    files: filesToSend,
                    driveRefs: driveRefs,
                    manualUpdates: {
                        nuevoCanon: $('#db_NUEVO_CANON_SOLO').val(),
                        nuevaVigenciaInicio: $('#fechaInicioVigencia').val(),
                        nuevaVigenciaFin: $('#fechaFinVigencia').val()
                    }
                };

                // 4. Enviar al Backend
                google.script.run
                    .withSuccessHandler((res) => {
                        Swal.fire('Guardado', 'Caso marcado como REVISADO.', 'success');
                        $('#modalGestionDocumentalIA').modal('hide');
                        if(typeof ReloadRenovacionesTable === 'function') ReloadRenovacionesTable();
                    })
                    .withFailureHandler((err) => {
                        Swal.close();
                        Swal.fire('Error', 'Fallo al guardar: ' + err.message, 'error');
                    })
                    .processAnalystDecision(payload);

            } catch (errorGeneral) {
                console.error(errorGeneral);
                Swal.fire('Error Cliente', 'Ocurrió un error preparando los datos.', 'error');
            }
        }
    });
};

    function ValuesCotizacion(Canon, Admon, FuncionarioBolivar, MesesVigencia) {
      var Tasa;
      if (FuncionarioBolivar == "Si") {
        Tasa = 0.03;
      } else if (FuncionarioBolivar == "No") {
        Tasa = 0.035;
      }
      var CanonAdmon = Canon + Admon;
      MesesVigencia = parseInt(MesesVigencia);
      var TotalAsegurado = CanonAdmon * MesesVigencia;
      var PrimaNeta = +TotalAsegurado * Tasa;
      var Iva19 = (PrimaNeta * 0.19);
      var PrimaPagar = parseInt(PrimaNeta + Iva19);
      return [PrimaPagar, TotalAsegurado]
    }

    function simulateTyping(mensajeTexto, text) {
      let index = 0;
      const speed = 25; // Velocidad de escritura en milisegundos
      function type() {
        if (index < text.length) {
          mensajeTexto.append(text.charAt(index));
          index++;
          setTimeout(type, speed);
        }
      }
      type();
    }

  function recolectarNotificacionDesdeSwalRenovacion() {
    var pop = Swal.getPopup();
    if (!pop) return { error: "Formulario no disponible." };
    var to = [];
    var cc = [];
    if (pop.querySelector(".swal-nf-chk-cliente").checked) {
      var e = pop.querySelector(".swal-nf-mail-cliente").value.trim();
      if (e) to.push(e);
    }
    if (pop.querySelector(".swal-nf-chk-analista").checked) {
      var e2 = pop.querySelector(".swal-nf-mail-analista").value.trim();
      if (e2) to.push(e2);
    }
    if (pop.querySelector(".swal-nf-chk-controlador").checked) {
      var e3 = pop.querySelector(".swal-nf-controlador-mail").value.trim();
      if (e3) to.push(e3);
    }
    pop.querySelectorAll(".swal-nf-opcional-row").forEach(function (row) {
      var chk = row.querySelector(".swal-nf-opcional-chk");
      var inp = row.querySelector(".swal-nf-opcional-mail");
      if (chk && chk.checked && inp && inp.value.trim()) cc.push(inp.value.trim());
    });
    var docKeys = [];
    pop.querySelectorAll(".swal-nf-doc-chk:checked").forEach(function (c) {
      docKeys.push(c.getAttribute("data-doc-key"));
    });
    if (to.length === 0) {
      return { error: "Marque al menos un destinatario principal con correo válido." };
    }
    return { to: to.join(","), cc: cc.join(","), docKeys: docKeys };
  }

  async function armarAdjuntosRenovacionPorKeys(docKeys) {
    var attachments = [];
    var driveAttachments = [];
    var pol = String((currentFullData && currentFullData.dataLead && (currentFullData.dataLead.poliza || currentFullData.dataLead.solicitud)) || "ref").replace(/[^\w.-]/g, "_") || "ref";
    var pref = {
      poliza: "POLIZA_RENOVADA",
      cedula: "CEDULA_TOMADOR",
      comprobante: "SOPORTE_PAGO",
      sarlaft: "SARLAFT",
      contrato: "CONTRATO_ARR",
      polizaAjuste: "POLIZA_CON_AJUSTE"
    };
    for (var i = 0; i < docKeys.length; i++) {
      var key = docKeys[i];
      var st = docState[key];
      if (!st || !st.approved) continue;
      if (st.file) {
        var p = await readFileAsBase64(st.file);
        attachments.push({
          fileName: p.name || key + ".pdf",
          mimeType: p.mimeType || "application/octet-stream",
          data: p.data
        });
      } else if (st.isDrive && st.url) {
        driveAttachments.push({
          key: key,
          url: st.url,
          fileName: (pref[key] || String(key).toUpperCase()) + "_" + pol + ".pdf"
        });
      }
    }
    return { attachments: attachments, driveAttachments: driveAttachments };
  }

  function ejecutarSwalNotificarYGuardarRenovacion(processPayload, tipoMail, textoObservacionesCorreo, uiOpts) {
    uiOpts = uiOpts || {};
    var modalContainer = document.getElementById("modalGestionDocumentalIA");
    var loadTitle = uiOpts.loadingTitle || "Procesando";
    var loadHtml = uiOpts.loadingHtml || "Guardando...";
    var okTitle = uiOpts.successTitle || "Listo";
    var okText = uiOpts.successText || "Gestión guardada.";

    function runProcessAnalyst() {
      Swal.fire({
        title: loadTitle,
        html: loadHtml,
        allowOutsideClick: false,
        didOpen: function () {
          Swal.showLoading();
        }
      });
      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            $("#modalGestionDocumentalIA").modal("hide");
            if (typeof ReloadRenovacionesTable === "function") ReloadRenovacionesTable();
            Swal.fire({ icon: "success", title: okTitle, text: okText, timer: 2200, showConfirmButton: false });
          } else {
            Swal.fire("Error", res.message, "error");
          }
        })
        .withFailureHandler(function (err) {
          Swal.fire("Error", err.message || String(err), "error");
        })
        .processAnalystDecision(processPayload);
    }

    Swal.fire({
      title: "Notificar por correo",
      html: htmlSwalNotificarRenovacionCorreo(),
      width: "34rem",
      icon: "question",
      focusConfirm: false,
      showCancelButton: true,
      showDenyButton: true,
      confirmButtonText: "Enviar correo y guardar",
      denyButtonText: "Guardar sin correo",
      cancelButtonText: "Cancelar",
      confirmButtonColor: "#E60000",
      denyButtonColor: "#6c757d",
      target: modalContainer,
      preConfirm: function () {
        var pack = recolectarNotificacionDesdeSwalRenovacion();
        if (pack.error) {
          Swal.showValidationMessage(pack.error);
          return false;
        }
        return pack;
      }
    }).then(async function (r) {
      if (
        r.dismiss === Swal.DismissReason.cancel ||
        r.dismiss === Swal.DismissReason.backdrop ||
        r.dismiss === Swal.DismissReason.esc
      ) {
        return;
      }
      if (r.isDenied) {
        runProcessAnalyst();
        return;
      }
      if (!r.isConfirmed || !r.value) return;
      try {
        var pack = r.value;
        var adj = await armarAdjuntosRenovacionPorKeys(pack.docKeys || []);
        var lead = processPayload.dataLead || {};
        var mailPayload = {
          tipo: tipoMail,
          to: pack.to,
          cc: pack.cc,
          subject: asuntoRenovCorreo(tipoMail, lead.poliza || lead.solicitud),
          observaciones: textoObservacionesCorreo || "",
          dataLead: lead,
          leadSelect: (currentFullData && currentFullData.leadSelect) || {},
          nombreAgente: (currentFullData && currentFullData.nombreAgente) || "",
          poliza: lead.poliza || lead.solicitud,
          attachments: adj.attachments,
          driveAttachments: adj.driveAttachments
        };
        Swal.fire({ title: "Enviando correo…", allowOutsideClick: false, didOpen: function () { Swal.showLoading(); } });
        google.script.run
          .withSuccessHandler(function (mailRes) {
            if (!mailRes || !mailRes.success) {
              Swal.fire("Error correo", (mailRes && mailRes.message) || "No se envió el correo.", "error");
              return;
            }
            runProcessAnalyst();
          })
          .withFailureHandler(function (err) {
            Swal.fire("Error correo", err.message || String(err), "error");
          })
          .enviarCorreoGestionRenovacion(JSON.stringify(mailPayload));
      } catch (ex) {
        console.error(ex);
        Swal.fire("Error", "No se pudieron preparar los adjuntos.", "error");
      }
    });
  }

  function calcularScore() {
    var score = 0;
    var filesLoaded = 0;
    var filesApproved = 0;

    DOC_KEYS.forEach(key => {
      if (docState[key].file || docState[key].isDrive || docState[key].isOmitted) { 
        score += SCORE_UPLOAD; // +14%
        filesLoaded++;
      }
      
      if (docState[key].approved) {
        score += SCORE_VALIDATE; // +6%
        filesApproved++;
      }
    });

    score = Math.min(Math.round(score), 100);

    $('#confidenceScore').text(score + '%');
    $('#confidenceFill').css('width', score + '%');

    var $badge = $('#statusBadge');
    var $msg = $('#verificationMessage');

    if (score >= 99) { 
      $msg.html('<strong class="text-success">Documentación completa y validada. Listo para renovar.</strong>');
      $badge.removeClass('status-pending status-corrections').addClass('status-approved')
        .html('<i class="fas fa-check-double"></i><span>Listo</span>');
    } else if (filesLoaded === 5) {  
      $msg.html('Archivos cargados. <strong class="text-danger">Por favor valida cada documento (Click en el Ojo).</strong>');
      $badge.removeClass('status-pending status-approved').addClass('status-corrections')
        .html('<i class="fas fa-eye"></i><span>Validación Manual</span>');
    } else {
      $msg.text(`Cargando documentos (${filesLoaded}/5)...`);
      $badge.removeClass('status-approved status-corrections').addClass('status-pending')
        .html('<i class="fas fa-spinner fa-spin"></i><span>Gestionando</span>');
    }
  }

  function renderizarPDFCompleto(file) {
    var wrapper = document.getElementById('pdf-pages-wrapper');
    wrapper.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Procesando páginas...</p></div>';

    var fileReader = new FileReader();

    fileReader.onload = function () {
      var typedarray = new Uint8Array(this.result);

      pdfjsLib.getDocument(typedarray).promise.then(function (pdf) {
        wrapper.innerHTML = '';

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {

          let canvas = document.createElement('canvas');
          canvas.id = 'pdf-page-' + pageNum;
          canvas.className = 'pdf-canvas mb-4 shadow-sm'; 
          canvas.style.maxWidth = '100%';
          canvas.style.display = 'block';
          canvas.style.margin = '0 auto 20px auto';  

          wrapper.appendChild(canvas);

          pdf.getPage(pageNum).then(function (page) {
            var scale = 1.5; 
            var viewport = page.getViewport({ scale: scale });
            var ctx = canvas.getContext('2d');

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            var renderContext = {
              canvasContext: ctx,
              viewport: viewport
            };
            page.render(renderContext);
          });
        }
      }).catch(function (error) {
        console.error('Error PDF:', error);
        wrapper.innerHTML = '<div class="alert alert-danger">El PDF está dañado o tiene contraseña.</div>';
      });
    };

    fileReader.readAsArrayBuffer(file);
  }

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => {
        let encoded = reader.result.toString().replace(/^data:(.*,)?/, '');
        if ((encoded.length % 4) > 0) {
          encoded += '='.repeat(4 - (encoded.length % 4));
        }
        
        resolve({
          data: encoded,
          mimeType: file.type,
          name: file.name
        });
      };
      reader.onerror = error => reject(error);
    });
  }


function extractEmbeddedFiles(jsonData) {
    let embeddedFiles = [];
     
    const keyMap = {
        'sarlaft': { type: 'sarlaft', context: 'Base de Datos (Legacy)' },
        'sarlaftArchivoURL': { type: 'sarlaft', context: 'Base de Datos' },
        'formatoRenovacion': { type: 'poliza', context: 'Formato Renovación' }, 
        'cedula': { type: 'cedula', context: 'Base de Datos' },
        'pazYsalvo': { type: 'pazYsalvo', context: 'Base de Datos' },
        'poliza': { type: 'poliza', context: 'Base de Datos' }
    };

    const dataSources = [jsonData.dataLead, jsonData.leadSelect];

    dataSources.forEach(source => {
        if (!source) return;

        Object.keys(source).forEach(key => {
            if (keyMap[key] && source[key]) {
                let rawValue = String(source[key]);
     
                let urls = rawValue.match(/\bhttps?:\/\/\S+/gi);
                
                if (urls) {
                    urls.forEach((url, index) => {
                        let cleanUrl = url.replace(/,$/, '').trim();
                        
                        embeddedFiles.push({
                            id: `legacy_${key}_${index}`, 
                            name: `${keyMap[key].type.toUpperCase()}_BD_${index + 1}.pdf`, // Nombre generado
                            mimeType: 'application/pdf',
                            url: cleanUrl,
                            size: 'Enlace Externo',
                            date: new Date().toISOString(),
                            context: keyMap[key].context 
                        });
                    });
                }
            }
        });
    });

    return embeddedFiles;
}

  function formatMoney(amount) {
    if (amount === null || amount === undefined || amount === '') return '$0';
     var str = String(amount);
    if (str.includes('$')) return str;

    var num = parseFloat(str.replace(/[^0-9.-]+/g, ""));
    if (isNaN(num)) return '$0';

    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(num);
  }

function convertirFechaParaInput(fechaTexto) {
    if (!fechaTexto) return '';
    if (fechaTexto.match(/^\d{4}-\d{2}-\d{2}$/)) return fechaTexto;
    const partes = fechaTexto.split('/'); // [cite: 75]
    if (partes.length === 3) {
      const dia = partes[0].padStart(2, '0');
      const mes = partes[1].padStart(2, '0');
      const anio = partes[2];
      return `${anio}-${mes}-${dia}`;  
    }
    return '';  
}

    let nuevo = Math.round((actual + cambio) * 10) / 10; // [cite: 80]

    $('#input_IPC').val(nuevo);
    recalcularCanonPorIPC();  
}


function inicializarCotizador(leadData) {

    if (fechaVencimientoISO) {
        const fechaBase = new Date(fechaVencimientoISO + 'T00:00:00');
         
        const fechaFin = new Date(fechaBase);
        fechaFin.setFullYear(fechaFin.getFullYear() + 1);
        $('#fechaFinVigencia').val(fechaFin.toISOString().split('T')[0]);
        const fechaInicio = new Date(fechaBase);
        fechaInicio.setDate(fechaInicio.getDate() + 1);

        recalcularCanonPorIPC();
        validarYCalcularFechas();
        
    } else {

    }
}


function validarYCalcularFechas() {
    const elInicio = document.getElementById('fechaInicioVigencia');
    const elFin = document.getElementById('fechaFinVigencia');

    if (!elInicio || !elFin) return;

    if (elInicio.value && !elFin.value) {
        const fInicio = new Date(elInicio.value + 'T00:00:00');
        const fFin = new Date(fInicio);
        fFin.setFullYear(fFin.getFullYear() + 1);
        elFin.value = fFin.toISOString().split('T')[0];
    }

    const inputInicio = elInicio.value;
    const inputFin = elFin.value;

    if (!inputInicio || !inputFin) return;

    const fInicio = new Date(inputInicio + 'T00:00:00');
    const fFin = new Date(inputFin + 'T00:00:00');

    // Validación básica: Fin no puede ser menor a Inicio
    if (fFin <= fInicio) {
        $('#displayMeses').text("Fecha Inválida");
        $('#alertaVigencia').removeClass('d-none').text("La fecha fin debe ser mayor al inicio");
        return;
    }

    // Calcular Meses exactos
    let meses = (fFin.getFullYear() - fInicio.getFullYear()) * 12;
    meses -= fInicio.getMonth();
    meses += fFin.getMonth();
    
    // Ajuste fino por días
    if (fFin.getDate() < fInicio.getDate()) meses--;

    // Calcular días totales
    const diffTime = Math.abs(fFin - fInicio);
    const dias = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    // Actualizar UI
    $('#displayMeses').text(meses + " Meses");
    $('#displayDias').text(dias + " Días");
    
    // Guardar meses calculados para la fórmula de cotización
    $('#formularioNuevaPoliza').data('meses-calculados', meses);

    // Alerta visual si es muy corto (tu lógica existente)
    if (meses < 5) {
         $('#alertaVigencia').removeClass('d-none').html('<i class="fas fa-ban me-1"></i> Vigencia inferior a 5 meses.');
         // No bloqueamos, pero avisamos
    } else {
         $('#alertaVigencia').addClass('d-none');
    }

    // Recalcular cotización con la nueva vigencia
    calcularCotizacion();
}

function recalcularCanonPorIPC() {
    // 1. OBTENER BASE MATEMÁTICA (El Canon del año pasado - Col B)
    // Lo recuperamos del atributo seguro que guardamos al abrir el modal
    let canonBaseHistorico = $('#formularioNuevaPoliza').data('base-canon-historico');

    // Fallback de seguridad: si por algo falla el data, buscamos en el objeto en memoria (Col B)
    if (!canonBaseHistorico) {
         let rootData = (typeof currentLeadData !== 'undefined' && currentLeadData.leadData) ? currentLeadData.leadData : {};
         let original = rootData.dataLead || {}; 
         canonBaseHistorico = parsearMoneda(original.canon) || 0;
    }

    if (canonBaseHistorico === 0) return; 

    // 2. OBTENER EL NUEVO IPC DEL INPUT
    let rawIPC = $('#input_IPC').val().toString();
    let ipc = parseFloat(rawIPC.replace(',', '.')) || 0;

    // 3. VALIDACIÓN VISUAL DE TOPE
    if (ipc > TOPE_IPC) {
        // Marcamos error visual pero permitimos calcular (para procesos especiales)
        $('#input_IPC').addClass('is-invalid text-danger');
    } else {
        $('#input_IPC').removeClass('is-invalid text-danger');
    }

    // 4. CALCULAR Y MOSTRAR
    // La fórmula correcta: Base Vieja * (1 + %IPC)
    let nuevoCanon = canonBaseHistorico * (1 + (ipc / 100));

    // Escribir en la celda de Nuevo Canon
    $('#db_NUEVO_CANON_SOLO').val(formatearMoneda(Math.round(nuevoCanon)));
    
    // Feedback visual
    $('#badgeIPC').text(`Base + ${ipc}%`);

    // Recalcular el resto de la cotización
    if (typeof calcularCotizacion === 'function') {
        calcularCotizacion();
    }
}

function calcularCotizacion() {
    // 0. LIMPIEZA VISUAL (ADIÓS AL "AZUL PAILA")
    // Cambiamos el estilo del badge de IPC a algo neutro y elegante
    $('#badgeIPC')
        .removeClass('bg-primary bg-opacity-10 text-primary') // Quita el azul
        .addClass('bg-light text-secondary border');          // Pone gris suave

    if (!$('#alertaVigencia').hasClass('d-none') && !$('#alertaVigencia').hasClass('hidden')) return;

    // 1. GESTIÓN DEL IVA COMERCIAL
    const tipoServ = $('#tipoServicio').val(); 
    if (tipoServ === 'COMERCIO') {
        $('#container_iva_comercial').show(); 
    } else {
        $('#container_iva_comercial').hide();
        $('#db_IVACOMERCIAL').val('$0'); 
    }

    // 2. OBTENER VALORES (Inputs)
    const valCanonSolo = parsearMoneda($('#db_NUEVO_CANON_SOLO').val()) || 0;
    const valAdmon = parsearMoneda($('#db_NUEVA_ADMINISTRACION').val()) || 0;
    const valIvaComercial = parsearMoneda($('#db_IVACOMERCIAL').val()) || 0; 

    // 3. BASE ASEGURABLE (FACTO: El IVA Comercial hace parte de la base del contrato)
    // La suma se hace AQUÍ sobre la base de cotización mensual
    const valCanonAdmon = valCanonSolo + valAdmon + valIvaComercial;

    const valServicios = parsearMoneda($('#nuevosServicios').val()) || 0;
    const valDyF = parsearMoneda($('#nuevosDyF').val()) || 0;
    
    // Si no se han calculado meses (carga inicial), asumimos 12
    const meses = $('#formularioNuevaPoliza').data('meses-calculados') || 12;

    // =========================================================
    // 4. CÁLCULOS (PRIMAS)
    // =========================================================

    // --- A. CANON (Base Total * Meses * Tasa) ---
    const aseguradoCanon = valCanonAdmon * meses; 
    const primaNetaCanon = aseguradoCanon * TASA_CANON; // 3.5%
    const ivaCanon = primaNetaCanon * IVA; // 19%
    const totalCanon = primaNetaCanon + ivaCanon; 

    // --- B. SERVICIOS PÚBLICOS ---
    let primaNetaServ = 0;
    let baseServicios = 0;
    
    // Deducibles
    if (tipoServ === 'VIVIENDA') {
        baseServicios = Math.max(0, valServicios - 1000000); 
    } else {
        baseServicios = Math.max(0, valServicios - 2000000); 
    }
    
    if (baseServicios > 0) {
        primaNetaServ = baseServicios * TASA_SERV_UNIFICADA; // 0.05
    }

    const ivaServ = primaNetaServ * IVA;
    const totalServ = primaNetaServ + ivaServ;

    // --- C. DAÑOS Y FALTANTES ---
    let primaNetaDyF = 0;
    let ivaDyF = 0;
    let totalDyF = 0;

    if (valDyF > 0) {
        if (valDyF < MIN_DYF) {
             $('#nuevosDyF').addClass('is-invalid'); 
             $('#card_total_dyf').text("Mín $1M").addClass('text-danger');
        } else {
             $('#nuevosDyF').removeClass('is-invalid');
             const aseguradoDyF = valDyF;
             primaNetaDyF = aseguradoDyF * TASA_DYF; // 5%
             ivaDyF = primaNetaDyF * IVA;
             totalDyF = primaNetaDyF + ivaDyF;
        }
    } else {
        $('#nuevosDyF').removeClass('is-invalid');
    }

    // =========================================================
    // 5. ACTUALIZACIÓN UI
    // =========================================================

    // Tarjeta Canon (Valores Base)
    // Muestra la Base Mensual Total (Canon + Admon + IvaCom)
    $('#card_base_total').text(formatearMoneda(valCanonAdmon)); 
    
    $('#card_prima_canon').text(formatearMoneda(Math.round(primaNetaCanon)));
    $('#card_iva_canon').text(formatearMoneda(Math.round(ivaCanon)));
    $('#card_total_canon').text(formatearMoneda(Math.round(totalCanon))); 

    // Tarjeta Servicios
    const textoTasaFija = (TASA_SERV_UNIFICADA * 100).toFixed(2) + '%';
    $('#card_tasa_serv').text(textoTasaFija).removeClass('text-danger').addClass('text-dark');
    $('#card_prima_serv').text(formatearMoneda(Math.round(primaNetaServ)));
    $('#card_iva_serv').text(formatearMoneda(Math.round(ivaServ)));
    $('#card_total_serv').text(formatearMoneda(Math.round(totalServ)));

    // Tarjeta DyF
    if (valDyF >= MIN_DYF || valDyF === 0) {
        $('#card_prima_dyf').text(formatearMoneda(Math.round(primaNetaDyF)));
        $('#card_iva_dyf').text(formatearMoneda(Math.round(ivaDyF)));
        $('#card_total_dyf').text(formatearMoneda(Math.round(totalDyF))).removeClass('text-danger');
    }

    // Total Final (Footer)
    const granTotal = totalCanon + totalServ + totalDyF;
    $('#cotizacionTotalFooter').text(formatearMoneda(Math.round(granTotal)));
    $('#valor_total_cotizacion').val(Math.round(granTotal)); 

    // Checkbox de control
    if (granTotal > 0 && !(valDyF > 0 && valDyF < MIN_DYF)) {
        $('#check-poliza').prop('checked', true);
    } else {
        $('#check-poliza').prop('checked', false);
    }
}

function formatCurrencyInput(input) {
      let value = input.value.replace(/\D/g, "");
    if (value === "") {
        input.value = "";
        return;
    }
    let numberVal = parseFloat(value);
    let formatted = new Intl.NumberFormat('es-CO', {
        style: 'currency',
        currency: 'COP',
        maximumFractionDigits: 0
    }).format(numberVal);
    input.value = formatted;
}


function parsearMoneda(valor) {
    if (!valor) return 0;
    let str = String(valor);

    let limpio = str.replace(/[^\d]/g, '');
    return limpio ? parseInt(limpio, 10) : 0;
}
