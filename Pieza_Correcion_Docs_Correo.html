<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <style type="text/css">
    * {
      font-family: 'Open Sans', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      background-image: url(https://storage.googleapis.com/proyecto-ia-servicios-bolivar.appspot.com/fondo-contenedor.png);

      background-size: cover;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      max-width: 635px;
      border-spacing: 0 !important;
      border-collapse: collapse !important;
    }

    .footer {
      padding: 20px;
      /*display: flex;*/
      justify-content: space-around;
      padding-bottom: 25px;
      background-image: url(https://storage.googleapis.com/proyecto-ia-servicios-bolivar.appspot.com/vigilado.png);
      background-repeat: no-repeat;
      background-size: contain;
      background-position-y: -4px;
    }

    .sponsor {
      width: 183px;
      padding: 0 4%;
    }

    .sponsor-2 {
      width: 196px;
      padding: 0 4%;
    }

    .imagen-header {
      width: 104%;
      display: block;
      max-width: 649px;
      background-image: url(https://storage.googleapis.com/proyecto-ia-servicios-bolivar.appspot.com/fondo-2.png);
      background-repeat: no-repeat;
      background-size: contain;
      height: 380px;
      background-position-x: -5px;
      background-position-y: -5px;
    }

    .titulo-header {
      background-image: url(https://storage.googleapis.com/proyecto-ia-servicios-bolivar.appspot.com/fondo-header.png);
      background-position: center;
      background-size: contain;
      background-repeat: no-repeat;
      padding: 20px 0;
      margin: -91px auto 0 auto;
      font-style: italic;
      width: 65%;
      color: #fff;
      font-size: 23px;
    }

    .sub-titulo {
      color: #132f53;
      font-weight: 800;
      font-style: italic;
      font-size: 23px;
      padding: 0;
      margin-top: -14px;
    }

    .main-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: url(https://storage.googleapis.com/proyecto-ia-servicios-bolivar.appspot.com/contenedor-link.png);
      background-repeat: no-repeat;
      width: 46%;
      background-size: contain;
      margin: 0 auto;
      background-position: center;

    }

    .btn-register {
      display: inline-block;
      padding: 6px 23px;
      background-color: #b32327;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      margin: 20px 0;
      font-size: 18px;
      border-radius: 35px;
      font-size: 17px;
      font-weight: bolder;
      margin-top: -10px;

    }

    .texto-1 {
      color: #575756;
      margin-top: 0px;
      font-weight: 500;
    }

    .texto-2 {
      color: #132f53;
      font-weight: bolder;
      margin-top: 1px;

    }

    .imagen-inicio {
      width: 105%;
      margin-left: -3%;
      margin-top: -4%;
    }

    @media screen and (min-width: 1025px) {
      .container {
        max-width: 635px;
      }

    }

    @media screen and (min-width: 640px) and (max-width: 1024px) {
      .container {
        width: 88%;
      }


    }

    @media screen and (max-width: 720px) {
      .imagen-header {
        width: 670px;
      }
    }

    @media screen and (max-width: 639px) {
      .container {
        width: 98%;
      }

      .titulo-header {
        padding: 13px 0;
        width: 89%;
      }

      @media screen and (max-width: 576px) {
        .container {
          width: 98%;
        }

        .espacio {

          margin-top: 10px;
        }

        .btn-register {
          font-size: 13px;
          margin-top: 1px;
        }

        .texto-1 {
          margin-bottom: 1px;
        }
      }

      @media screen and (max-width: 342px) {
        .sponsor {
          margin-top: 15px;
          width: 139px;
        }

        .sponsor-2 {
          width: 136px;
        }

        .btn-register {
          font-size: 11px;
          margin-top: 1px;
        }

        .texto-1 {
          margin-bottom: 4px;
          font-size: 13px;
        }

        .texto-2 {
          font-size: 13px;
        }


      }
    }
  </style>
</head>

<body>
  <table class="container">
    <div class="sub-container">
      <tr>
        <td class="header">
          <img src="https://storage.googleapis.com/proyecto-ia-servicios-bolivar.appspot.com/fondo-2.png" class="imagen-inicio">
        </td>
      </tr>



      <tr>
        <td>
          <div>
            <p class="texto-2">Debes corregir los siguientes documentos:</p>
            "Reemplazar"
          </div>
        </td>
      </tr>

      <tr>
        <td>
          <div>
            <a href="https://libertador.com.co/cotizaciones/" target="_blank">clic aquí para corregir tus documentos.</a>
          </div>
        </td>
      </tr>

      <tr>
        <td class="footer">

          <img src="https://storage.googleapis.com/proyecto-ia-servicios-bolivar.appspot.com/logo-libertador.png" alt="libertador" class="sponsor-2">
          <img src="https://storage.googleapis.com/proyecto-ia-servicios-bolivar.appspot.com/logo-bolivar.png" alt="bolivar" class="sponsor espacio">
        </td>
      </tr>
    </div>
  </table>

</body>

</html>
